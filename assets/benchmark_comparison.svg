<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barOurs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barOld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="12" fill="url(#cbg)"/>
  <rect x="1" y="1" width="958" height="398" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="40" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    ADVERSARIAL REWRITE FLIP-TO-HUMAN RATE (2,500 DOCUMENT REPLICATION)
  </text>
  <text x="480" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Evaluated across Peer Review Detection Benchmark (Yu et al., 2026) and COLING Datasets
  </text>

  <!-- Chart Grid Area -->
  <g transform="translate(180, 90)">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-15" y="4" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">100%</text>

    <line x1="0" y1="55" x2="680" y2="55" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-15" y="59" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">75%</text>

    <line x1="0" y1="110" x2="680" y2="110" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-15" y="114" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">50%</text>

    <line x1="0" y1="165" x2="680" y2="165" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-15" y="169" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">25%</text>

    <line x1="0" y1="220" x2="680" y2="220" stroke="#475569" stroke-width="1.5"/>
    <text x="-15" y="224" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0%</text>

    <!-- Bars -->
    <!-- 1. Raw Baseline -->
    <rect x="40" y="218" width="80" height="2" rx="2" fill="#ef4444"/>
    <text x="80" y="210" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">0.0%</text>
    <text x="80" y="242" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Raw AI Draft</text>
    <text x="80" y="258" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(GPT-4o Baseline)</text>

    <!-- 2. Generic Humanize Prompt -->
    <rect x="200" y="201" width="80" height="19" rx="2" fill="url(#barOld)"/>
    <text x="240" y="195" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">8.7%</text>
    <text x="240" y="242" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Generic Prompt</text>
    <text x="240" y="258" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">("write like human")</text>

    <!-- 3. Banned Word Heuristics -->
    <rect x="360" y="189" width="80" height="31" rx="2" fill="url(#barOld)"/>
    <text x="400" y="183" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">14.1%</text>
    <text x="400" y="242" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Word Blacklist</text>
    <text x="400" y="258" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Typical GitHub Repos)</text>

    <!-- 4. Our Engine -->
    <rect x="520" y="12" width="100" height="208" rx="4" fill="url(#barOurs)"/>
    <text x="570" y="6" font-family="sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">94.8%</text>
    <text x="570" y="242" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Our Dual-Engine</text>
    <text x="570" y="258" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(SAE + Cognitive + Linter)</text>
  </g>
</svg>