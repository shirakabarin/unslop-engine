  <text x="54" y="228" font-family="sans-serif" font-size="10" fill="#64748b">• Flatline burstiness (CV &lt; 0.25)</text>
  <text x="54" y="246" font-family="sans-serif" font-size="10" fill="#64748b">• Dependency distance &gt; 18</text>

