<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="478" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Title -->
  <text x="480" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    MECHANISTIC HUMANIZATION PIPELINE
  </text>
  <text x="480" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Grounded in Sparse Autoencoders (arXiv:2610.30006) and Cognitive Load Theory (arXiv:2610.29162)
  </text>

  <!-- Left Input Card -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="190" height="320" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="6" rx="3" fill="url(#glowRed)"/>
    <text x="95" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">RAW SYNTHETIC DRAFT</text>
    
    <!-- Characteristics list -->
    <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• Rigid Structure</text>
    <text x="28" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">Double colons (**H:**:)</text>
    <text x="28" y="106" font-family="sans-serif" font-size="10" fill="#94a3b8">Parenthesized lists (1)(2)</text>
    <text x="28" y="122" font-family="sans-serif" font-size="10" fill="#94a3b8">Symmetric triads (A, B, C)</text>

    <text x="20" y="156" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• High Cognitive Load</text>
    <text x="28" y="176" font-family="sans-serif" font-size="10" fill="#94a3b8">Long-distance nested clauses</text>
    <text x="28" y="192" font-family="sans-serif" font-size="10" fill="#94a3b8">Jargon chains &amp; buzzwords</text>

    <text x="20" y="226" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• Flatline Rhythm</text>
    <text x="28" y="246" font-family="sans-serif" font-size="10" fill="#94a3b8">Uniform sentence lengths</text>
    <text x="28" y="262" font-family="sans-serif" font-size="10" fill="#94a3b8">Burstiness CV &lt; 0.25</text>
    
    <rect x="20" y="285" width="150" height="22" rx="4" fill="#881337" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1"/>
    <text x="95" y="300" font-family="sans-serif" font-size="10" font-weight="700" fill="#fda4af" text-anchor="middle">Detected as AI: 99.8%</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 235 260 L 265 260" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="268,260 262,256 262,264" fill="#06b6d4"/>

  <!-- Center Processing Pipeline -->
  <g transform="translate(275, 100)" filter="url(#shadow)">
    <rect width="410" height="320" rx="8" fill="url(#cardGrad1)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="6" rx="3" fill="url(#glowCyan)"/>
    <text x="205" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">DUAL-ENGINE TRANSFORMATION MATRIX</text>

    <!-- Stage 1 Box -->
    <rect x="20" y="52" width="370" height="72" rx="6" fill="#0c1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="32" y="72" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. Sparse Autoencoder (SAE) Residual-Stream Filter</text>
    <text x="32" y="90" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Suppress High-Logit AI tells: **Header:**: (+0.67), (1)(2) (+0.90), thorough (+0.99)</text>
    <text x="32" y="106" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Induce Human Negative-Logit markers: subjective voice 'I' (-0.92), hedges 'seem' (-0.81)</text>

    <!-- Stage 2 Box -->
    <rect x="20" y="136" width="370" height="72" rx="6" fill="#0c1a2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="32" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">2. Psycholinguistic Cognitive Decompression</text>
    <text x="32" y="174" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Minimize syntactic dependency distance (&lt;12 tokens) to protect working memory</text>
    <text x="32" y="190" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Restore active transitive verbs; decompose nominalized corporate pseudo-concepts</text>

    <!-- Stage 3 Box -->
    <rect x="20" y="220" width="370" height="76" rx="6" fill="#0c1a2e" stroke="#065f46" stroke-width="1"/>
    <text x="32" y="240" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">3. Deterministic CLI Verification Gate (scripts/audit_humanity.py)</text>
    <text x="32" y="258" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Enforce Burstiness Variance (CV &gt;= 0.45, non-linear sentence rhythms)</text>
    <text x="32" y="274" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Deterministic regex tell scanner — fails gate and triggers rewrite if score &lt; 80</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 690 260 L 720 260" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="723,260 717,256 717,264" fill="#10b981"/>

  <!-- Right Output Card -->
  <g transform="translate(730, 100)" filter="url(#shadow)">
    <rect width="190" height="320" rx="8" fill="url(#cardGrad1)" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="6" rx="3" fill="url(#glowGreen)"/>
    <text x="95" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">AUTHENTIC PROSE</text>

    <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• Asymmetric Cadence</text>
    <text x="28" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">Burstiness CV: 0.58 ~ 0.92</text>
    <text x="28" y="106" font-family="sans-serif" font-size="10" fill="#94a3b8">Punchy conclusions</text>

    <text x="20" y="140" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• Low Cognitive Load</text>
    <text x="28" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Mean Dep. Length: 7.2</text>
    <text x="28" y="176" font-family="sans-serif" font-size="10" fill="#94a3b8">Vivid action verbs</text>

    <text x="20" y="210" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">• Human Epistemics</text>
    <text x="28" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8">Subjective observer voice</text>
    <text x="28" y="246" font-family="sans-serif" font-size="10" fill="#94a3b8">Natural cognitive hedges</text>

    <rect x="20" y="285" width="150" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
    <text x="95" y="300" font-family="sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Audit Score: 100/100</text>
  </g>
</svg>