<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    System Pipeline | Mechanistic AI-to-Human Transformation Architecture
  </text>
  <text x="40" y="50" font-family="sans-serif" font-size="11" fill="#64748b">
    Coupling SAE residual-stream tell suppression with psycholinguistic cognitive load decompression
  </text>

  <!-- Box 1: Input -->
  <rect x="40" y="80" width="170" height="220" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="40" y="80" width="170" height="28" rx="4" fill="#f1f5f9"/>
  <text x="125" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Input (Frontier LLM)</text>
  <text x="52" y="128" font-family="sans-serif" font-size="10" fill="#334155" font-weight="600">Synthetic Indicators:</text>
  <text x="52" y="146" font-family="sans-serif" font-size="10" fill="#64748b">• Double colons (**H:**:)</text>
  <text x="52" y="162" font-family="sans-serif" font-size="10" fill="#64748b">• Parentheses lists (1)(2)</text>
  <text x="52" y="178" font-family="sans-serif" font-size="10" fill="#64748b">• Forced triads (A, B, C)</text>
  <text x="52" y="194" font-family="sans-serif" font-size="10" fill="#64748b">• Nested nominalizations</text>
  <text x="52" y="210" font-family="sans-serif" font-size="10" fill="#64748b">• Flatline Burstiness</text>
  <rect x="52" y="260" width="146" height="22" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="125" y="275" font-family="sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Detection Logit: High (AI)</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="190" x2="246" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="252,190 244,186 244,194" fill="#64748b"/>

  <!-- Box 2: Transformation Engine -->
  <rect x="255" y="80" width="370" height="220" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="255" y="80" width="370" height="28" rx="4" fill="#e2e8f0"/>
  <text x="440" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Transformation Pipeline</text>

  <!-- Sub-block 1: SAE -->
  <rect x="270" y="118" width="340" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="280" y="134" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e40af">1. SAE Residual-Stream Filter (arXiv:2610.30006)</text>
  <text x="280" y="152" font-family="sans-serif" font-size="9.5" fill="#475569">Suppress positive tells (Header::, thorough) | Induce negative tells ('I', seem)</text>

  <!-- Sub-block 2: Cognitive -->
  <rect x="270" y="174" width="340" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="280" y="190" font-family="sans-serif" font-size="10" font-weight="700" fill="#1e40af">2. Cognitive Load Decompression (arXiv:2610.29162)</text>
  <text x="280" y="208" font-family="sans-serif" font-size="9.5" fill="#475569">Minimize dependency length (&lt;12 tokens) | Restore active transitive verbs</text>

  <!-- Sub-block 3: Linter -->
  <rect x="270" y="230" width="340" height="48" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="280" y="246" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d">3. Deterministic CLI Gate (scripts/audit_humanity.py)</text>
  <text x="280" y="264" font-family="sans-serif" font-size="9.5" fill="#475569">Verify Burstiness Variance (CV &gt;= 0.45) | Regex tell scan (Must score &gt;= 80)</text>

  <!-- Arrow 2 -->
  <line x1="625" y1="190" x2="661" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="667,190 659,186 659,194" fill="#64748b"/>

  <!-- Box 3: Output -->
  <rect x="670" y="80" width="170" height="220" rx="4" fill="#f8fafc" stroke="#86efac" stroke-width="1.2"/>
  <rect x="670" y="80" width="170" height="28" rx="4" fill="#dcfce7"/>
  <text x="755" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Authentic Human Output</text>
  <text x="682" y="128" font-family="sans-serif" font-size="10" fill="#334155" font-weight="600">Linguistic Qualities:</text>
  <text x="682" y="146" font-family="sans-serif" font-size="10" fill="#15803d">• High Burstiness (CV &gt; 0.55)</text>
  <text x="682" y="162" font-family="sans-serif" font-size="10" fill="#15803d">• Asymmetric clause lengths</text>
  <text x="682" y="178" font-family="sans-serif" font-size="10" fill="#15803d">• Low dependency distance</text>
  <text x="682" y="194" font-family="sans-serif" font-size="10" fill="#15803d">• Natural subjective voice</text>
  <text x="682" y="210" font-family="sans-serif" font-size="10" fill="#15803d">• Genuine cognitive hedges</text>
  <rect x="682" y="260" width="146" height="22" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="755" y="275" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Human Verified: 94.8%</text>
</svg>